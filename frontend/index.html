<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Drone Radar UA // OSINT Command</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
        body { background: #0a0c10; color: #00ff66; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #121620; border-bottom: 1px solid #1f293d; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        header h1 { color: #fff; font-size: 16px; }
        .main { display: flex; flex: 1; height: calc(100vh - 45px); }
        #map { flex: 2; height: 100%; background: #05070a; }
        .sidebar { flex: 1; background: #0e121a; border-left: 1px solid #1f293d; padding: 15px; overflow-y: auto; max-width: 420px; }
        .title { font-size: 12px; color: #8b9bb4; border-bottom: 1px solid #1f293d; padding-bottom: 4px; margin-bottom: 10px; text-transform: uppercase; }
        .card { background: #141b26; border: 1px solid #ff3333; padding: 10px; margin-bottom: 8px; font-size: 12px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 15px; }
        button { background: #1a2333; color: #00ff66; border: 1px solid #2f425c; padding: 8px; cursor: pointer; font-size: 11px; text-transform: uppercase; }
        button:hover { background: #24324a; }
        input { width: 100%; background: #080a0f; border: 1px solid #2f425c; color: #fff; padding: 6px; margin-bottom: 6px; font-size: 11px; }
    </style>
</head>
<body>
    <header>
        <h1>DRONE RADAR UA // OSINT FEED</h1>
        <span style="font-size: 12px; color: #00ff66;" id="conn-status">ПІДКЛЮЧЕННЯ...</span>
    </header>
    <div class="main">
        <div id="map"></div>
        <div class="sidebar">
            <div class="title">Фокус (Регіони)</div>
            <div class="controls">
                <button onclick="map.setView([47.8388, 35.1396], 12)">Запоріжжя</button>
                <button onclick="map.setView([50.4501, 30.5234], 12)">Київ</button>
            </div>
            <div class="title">Введення OSINT цілі</div>
            <input type="text" id="targetId" placeholder="ID цілі" value="UAV-ZP-01">
            <input type="number" id="targetLat" placeholder="Широта" value="47.8500" step="0.0001">
            <input type="number" id="targetLon" placeholder="Довгота" value="35.1200" step="0.0001">
            <input type="number" id="targetAlt" placeholder="Висота (м)" value="350">
            <input type="number" id="targetSpeed" placeholder="Швидкість (км/ч)" value="120">
            <input type="number" id="targetHeading" placeholder="Азимут (0-360)" value="45">
            <button onclick="sendTarget()" style="width:100%; background:#1f3322; border-color:#00ff66; margin-bottom:15px;">Передати ціль в систему</button>

            <div class="title">Активні об'єкти</div>
            <div id="targets-container">Очікування даних...</div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([47.8388, 35.1396], 11);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        const layerGroup = L.layerGroup().addTo(map);
        const wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(wsProtocol + location.host);

        ws.onopen = () => { document.getElementById('conn-status').innerText = "ONLINE (30 FPS)"; };
        ws.onclose = () => { document.getElementById('conn-status').innerText = "OFFLINE"; };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === "live_radar") {
                layerGroup.clearLayers();
                let html = '';
                if (msg.data.length === 0) {
                    document.getElementById('targets-container').innerHTML = '<div style="color:#666;font-size:11px;">Немає цілей.</div>';
                    return;
                }
                msg.data.forEach(t => {
                    L.circleMarker([t.lat, t.lon], { radius: 6, color: '#ff3333', fillOpacity: 1 }).addTo(layerGroup);
                    L.polyline([[t.lat, t.lon], [t.impact.lat, t.impact.lon]], { color: '#ff3333', dashArray: '3,3', weight: 1.5 }).addTo(layerGroup);
                    L.circleMarker([t.impact.lat, t.impact.lon], { radius: 4, color: '#ffff00', fillOpacity: 0.9 }).addTo(layerGroup);

                    html += `
                        <div class="card">
                            <b>${t.id}</b><br>
                            Коорд: ${t.lat.toFixed(4)}, ${t.lon.toFixed(4)}<br>
                            Висота: ${t.altitude}м | Шв: ${t.speed} км/ч<br>
                            <b>Прогноз удару:</b> ~${t.impact.distance_meters}м (через ${t.impact.time_to_impact_sec}с)<br>
                            Точка: ${t.impact.lat.toFixed(4)}, ${t.impact.lon.toFixed(4)}
                        </div>
                    `;
                });
                document.getElementById('targets-container').innerHTML = html;
            }
        };

        function sendTarget() {
            const payload = {
                id: document.getElementById('targetId').value,
                lat: parseFloat(document.getElementById('targetLat').value),
                lon: parseFloat(document.getElementById('targetLon').value),
                altitude: parseFloat(document.getElementById('targetAlt').value),
                speed: parseFloat(document.getElementById('targetSpeed').value),
                heading: parseFloat(document.getElementById('targetHeading').value),
            };
            fetch('/api/v1/targets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(res => res.json()).catch(err => alert("Помилка: " + err));
        }
    </script>
</body>
</html>
